name: Cobrinha de contribuições

on:
  schedule:
    - cron: "30 6 * * *" # todo dia, 06:30 UTC
  workflow_dispatch: # permite rodar manualmente (aba Actions)
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

# serializa com o workflow de estatísticas para evitar push concorrente na main
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] o push final precisa das credenciais

      - name: Gerar a cobrinha
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Publicar se houve mudança
        run: |
          cp dist/snake.svg dist/snake-light.svg assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-light.svg
          git diff --cached --quiet || (git commit -m "chore: atualiza a cobrinha de contribuições" && git push)

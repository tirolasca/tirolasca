name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 06:00 UTC
  workflow_dispatch: # permite rodar manualmente (aba Actions)
  push:
    paths:
      - ".github/scripts/generate_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/generate_stats.py

      - name: Publicar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          git diff --cached --quiet || (git commit -m "chore: atualiza estatísticas do perfil" && git push)

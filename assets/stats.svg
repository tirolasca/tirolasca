<svg xmlns="http://www.w3.org/2000/svg" width="420" height="210" viewBox="0 0 420 210" role="img" aria-label="Estatísticas do GitHub">
<title>Estatísticas do GitHub</title><desc>Estrelas, commits, pull requests, issues, repositórios e seguidores de tirolasca</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04171b"/><stop offset="1" stop-color="#020b0e"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#00f0d1"/><stop offset="1" stop-color="#00aaff"/></linearGradient></defs>
<style>
.t{font:700 18px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#00f0d1}
.n{font:800 22px 'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.l{font:500 12px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9fb8bd}
.ln{font:600 13px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#e6f4f1}
.p{font:500 12px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9fb8bd}
.i{opacity:0;animation:in .6s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.i{animation:none;opacity:1}animate{display:none}}
</style>
<rect x=".75" y=".75" width="418.5" height="208.5" rx="14" fill="url(#bg)" stroke="#00f0d1" stroke-opacity=".4" stroke-width="1.5"/>
<rect x="24" y="52" width="40" height="2" rx="1" fill="url(#ac)"/>
<text x="24" y="38" class="t">Estatísticas do GitHub</text>
<g class="i" style="animation-delay:0.00s"><text x="24" y="90" class="n" fill="#ffd166">0</text><text x="24" y="105" class="l">Estrelas recebidas</text></g>
<g class="i" style="animation-delay:0.08s"><text x="214" y="90" class="n" fill="#00f0d1">303</text><text x="214" y="105" class="l">Commits públicos</text></g>
<g class="i" style="animation-delay:0.16s"><text x="24" y="130" class="n" fill="#00aaff">10</text><text x="24" y="145" class="l">Pull requests</text></g>
<g class="i" style="animation-delay:0.24s"><text x="214" y="130" class="n" fill="#00ff80">0</text><text x="214" y="145" class="l">Issues abertas por mim</text></g>
<g class="i" style="animation-delay:0.32s"><text x="24" y="170" class="n" fill="#00f0d1">27</text><text x="24" y="185" class="l">Repositórios públicos</text></g>
<g class="i" style="animation-delay:0.40s"><text x="214" y="170" class="n" fill="#00aaff">16</text><text x="214" y="185" class="l">Seguidores</text></g>
</svg>
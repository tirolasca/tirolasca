<svg xmlns="http://www.w3.org/2000/svg" width="860" height="140" viewBox="0 0 860 140" role="img" aria-label="Sequência de contribuições">
<title>Sequência de contribuições</title><desc>Contribuições, sequência atual e maior sequência de tirolasca nos últimos 12 meses</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04171b"/><stop offset="1" stop-color="#020b0e"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#00f0d1"/><stop offset="1" stop-color="#00aaff"/></linearGradient></defs>
<style>
.t{font:700 18px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#00f0d1}
.n{font:800 22px 'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.l{font:500 12px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9fb8bd}
.ln{font:600 13px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#e6f4f1}
.p{font:500 12px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9fb8bd}
.i{opacity:0;animation:in .6s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.i{animation:none;opacity:1}animate{display:none}}
</style>
<rect x=".75" y=".75" width="858.5" height="138.5" rx="14" fill="url(#bg)" stroke="#00f0d1" stroke-opacity=".4" stroke-width="1.5"/>
<rect x="24" y="52" width="40" height="2" rx="1" fill="url(#ac)"/>
<text x="24" y="38" class="t">Sequência de contribuições</text>
<g class="i" style="animation-delay:0.0s"><text x="164" y="96" class="n" fill="#00f0d1" text-anchor="middle" style="font-size:30px">306</text><text x="164" y="118" class="l" text-anchor="middle">Contribuições em 12 meses</text></g>
<g class="i" style="animation-delay:0.1s"><text x="450" y="96" class="n" fill="#ffd166" text-anchor="middle" style="font-size:30px">1</text><text x="450" y="118" class="l" text-anchor="middle">Sequência atual (dias)</text></g>
<g class="i" style="animation-delay:0.2s"><text x="736" y="96" class="n" fill="#00aaff" text-anchor="middle" style="font-size:30px">6</text><text x="736" y="118" class="l" text-anchor="middle">Maior sequência em 12 meses</text></g>
</svg>